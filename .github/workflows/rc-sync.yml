name: Temporary RC compatibility validation
on:
  push:
    branches:
      - audit/dsh-0.2.1-rc.2
permissions:
  contents: write
jobs:
  sync-and-check:
    if: github.repository == 'zz-zhi54/dsh-plugins'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Resolve the updated dependency graph
        run: pnpm install --no-frozen-lockfile
      - name: Validate workspace
        run: |
          pnpm check
          pnpm -r --if-present run test
          git diff --check
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'pnpm-lock.yaml is unchanged'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(compat): regenerate lockfile for DSH 0.2.1-rc.2"
          git push origin HEAD:audit/dsh-0.2.1-rc.2
